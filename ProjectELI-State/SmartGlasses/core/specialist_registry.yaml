      - tuning_workflow
      - fault_logic_review
      - signal_path_reasoning
      - practical_tuning_guidance

    weaknesses:
      - industrial_design
      - broad_product_strategy
      - polished_report_writing

    consultation_modes:
      - advisory
      - delegated_drafting
      - competitive
      - instrumental

    trust_defaults:
      domain_reasoning: 0.81
