version: 1

specialists:
  - id: embedded_linux_specialist_v1
    label: Embedded Linux Specialist
    class: embedded_systems_specialist
    endpoint_type: api
    endpoint_ref: embedded_linux_specialist_v1
    enabled: true

    domains:
      - raspberry_pi
      - linux_device_setup
      - gpio
      - i2c
      - spi
      - uart
      - camera_stack
      - systemd
      - embedded_python
      - device_integration
      - edge_runtime
      - device_services

    input_types:
      - text
      - code
      - config
      - logs

    output_types:
      - analysis
      - code
      - setup_steps
      - debugging_plan
      - subsystem_diagram
      - interface_map

    strengths:
      - hardware bring_up
      - linux integration
      - on_device debugging
      - service configuration
      - subsystem mapping
      - interface definition

    weaknesses:
      - investor writing
      - industrial design
      - high_level_product_strategy

    consultation_modes:
      - advisory
      - delegated_drafting
      - competitive

    trust_defaults:
      domain_reasoning: 0.78
      implementation_specificity: 0.83
      constraint_fidelity: 0.76
      hallucination_risk: 0.28
      artifact_quality: 0.67

    cost_class: medium
    latency_class: medium

  - id: controls_specialist_v1
    label: Controls Specialist
